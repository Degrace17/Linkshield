<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShield</title>

  <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07152f;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #0d2145;
    padding: 32px 22px;
    border-radius: 24px;
    border: 1px solid #24518c;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
    text-align: center;
}

.logo {
    font-size: 64px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px rgba(23, 105, 224, 0.7));
}

h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 1px;
    font-weight: 700;
}

.subtitle {
    color: #9eb6d8;
    margin: 8px 0 28px;
    font-size: 15px;
}

input {
    width: 100%;
    padding: 17px;
    border: 1px solid #31598e;
    border-radius: 14px;
    background: #06162f;
    color: white;
    font-size: 16px;
    outline: none;
}

input::placeholder {
    color: #7188aa;
}

input:focus {
    border-color: #1769e0;
    box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.18);
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 17px;
    border: none;
    border-radius: 14px;
    background: #1769e0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(23, 105, 224, 0.35);
}

button:active {
    transform: scale(0.97);
}

#result {
    margin-top: 22px;
    padding: 16px;
    border-radius: 14px;
    background: #06162f;
    border: 1px solid #24518c;
    color: #dce8f8;
    line-height: 1.6;
    text-align: left;
}
  </style>
</head>

<body>

  <div class="container">

<div class="logo">🛡️</div>

    <h1>LinkShield</h1>

    
<p class="subtitle">Protect yourself from dangerous links.</p>
    <input
      id="linkInput"
      type="text"
      placeholder="Paste a link here..."
    >

    <br>

    <button onclick="checkLink()">Check Link</button>

    
  <div id="result">
  Your security report will appear here.
  </div>
    </div>

  <script>
    function checkLink() {
      const link = document.getElementById("linkInput").value.trim();
      const result = document.getElementById("result");

      if (link === "") {
        result.innerHTML = "⚠️ Please enter a link first.";
        result.style.color = "orange";
        return;
      }

      try {
        const url = new URL(link);

        const suspiciousWords = [
          "login",
          "verify",
          "password",
          "account",
          "bank",
          "secure",
          "update",
          "confirm"
        ];

        const foundWords = suspiciousWords.filter(word =>
          url.href.toLowerCase().includes(word)
        );

        const ipAddressPattern =
          /^https?:\/\/(\d{1,3}\.){3}\d{1,3}/;

        const isIpAddress = ipAddressPattern.test(url.href);
        const hasAtSymbol = url.href.includes("@");
        const isVeryLong = url.href.length > 150;

        let warnings = 0;
        let reasons = [];

        if (url.protocol !== "https:") {
          warnings++;
          reasons.push("⚠️ This link does not use HTTPS.");
        }

        if (isIpAddress) {
          warnings++;
          reasons.push(
            "⚠️ This link uses an IP address instead of a normal domain."
          );
        }

        if (hasAtSymbol) {
          warnings++;
          reasons.push("⚠️ This link contains an @ symbol.");
        }

        if (isVeryLong) {
          warnings++;
          reasons.push("⚠️ This link is unusually long.");
        }

        if (foundWords.length > 0) {
          warnings++;
          reasons.push(
            "⚠️ Suspicious words detected: " + foundWords.join(", ")
          );
        }

        if (warnings === 0) {
          result.innerHTML =
            "<strong>🛡️ LINKSHIELD SECURITY REPORT</strong><br><br>" +
            "🟢 Status: No obvious warning signs detected<br>" +
            "Risk indicators: 0<br><br>" +
            "HTTPS: ✅ Present<br>" +
            "IP address: ✅ Normal domain<br>" +
            "Suspicious words: ✅ None detected<br>" +
            "URL length: ✅ Normal<br>" +
            "@ symbol: ✅ None detected";

          result.style.color = "green";

        } else {
          result.innerHTML =
            "<strong>🛡️ LINKSHIELD SECURITY REPORT</strong><br><br>" +
            "🟡 Status: Caution<br>" +
            "Risk indicators detected: " + warnings + "<br><br>" +
            "<strong>Why this link was flagged:</strong><br>" +
            reasons.join("<br>") +
            "<br><br>" +
            "Please review this link carefully before continuing.";

          result.style.color = "orange";
        }

      } catch (error) {
        result.innerHTML =
          "❌ This does not appear to be a valid link.";
        result.style.color = "red";
      }
    }
  </script>

</body>
</html>
