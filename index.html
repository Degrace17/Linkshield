<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LinkShield</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf3ff;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      color: #0b4f9c;
      font-size: 36px;
      margin-bottom: 5px;
    }

    .tagline {
      color: #4f78a8;
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      max-width: 500px;
      padding: 14px;
      border: 2px solid #0b4f9c;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 13px 25px;
      background: #0b4f9c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #083b75;
    }

    #result {
      margin: 25px auto;
      padding: 20px;
      max-width: 600px;
      background: white;
      border-radius: 10px;
      text-align: left;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>🛡️ TEST LINKSHIELD</h1>

  <p class="tagline">
    Check a link before you click.
  </p>

  <input
    type="text"
    id="linkInput"
    placeholder="Paste a link here..."
  >

  <br>

  <button onclick="checkLink()">Check Link</button>

  <div id="result">
    Your security report will appear here.
  </div>


<script>

function checkLink() {

  const link = document.getElementById("linkInput").value.trim();
  const result = document.getElementById("result");

  if (link === "") {
    result.innerHTML = "⚠️ Please enter a link first.";
    result.style.color = "orange";
    return;
  }

  try {

    const url = new URL(link);

    let riskScore = 0;
    let warnings = [];
    let actions = [];


    // HTTPS
    if (url.protocol !== "https:") {

      riskScore += 20;

      warnings.push(
        "⚠️ This link does not use HTTPS."
      );

      actions.push(
        "🔐 Avoid entering sensitive information."
      );
    }


    // IP address
    const isIPAddress =
      /^(\d{1,3}\.){3}\d{1,3}$/.test(url.hostname);

    if (isIPAddress) {

      riskScore += 15;

      warnings.push(
        "⚠️ This link uses an IP address instead of a normal domain."
      );

      actions.push(
        "🔎 Make sure you trust the website."
      );
    }


    // @ symbol
    if (link.includes("@")) {

      riskScore += 20;

      warnings.push(
        "⚠️ This link contains an @ symbol."
      );

      actions.push(
        "🚨 Check the real destination carefully."
      );
    }


    // Long URL
    if (link.length > 150) {

      riskScore += 10;

      warnings.push(
        "⚠️ This link is unusually long."
      );

      actions.push(
        "🔎 Be careful with very long links."
      );
    }


    // Suspicious words
    const suspiciousWords = [
      "login",
      "verify",
      "verification",
      "password",
      "urgent",
      "unlock",
      "signin",
      "bank",
      "payment"
    ];

    const lowerLink = link.toLowerCase();

    const foundWords = suspiciousWords.filter(word =>
      lowerLink.includes(word)
    );

    if (foundWords.length > 0) {

      riskScore += 15;

      warnings.push(
        "⚠️ This link contains suspicious words: " +
        foundWords.join(", ") +
        "."
      );

      actions.push(
        "🔐 Do not enter your password, PIN, OTP, or banking details unless you are certain the website is genuine."
      );
    }


    // Many subdomains
    const hostnameParts = url.hostname.split(".");

    if (hostnameParts.length > 4) {

      riskScore += 10;

      warnings.push(
        "⚠️ This link contains many subdomains."
      );

      actions.push(
        "🔎 Carefully check the main domain name."
      );
    }


    // Encoded characters
    if (/%[0-9A-Fa-f]{2}/.test(link)) {

      riskScore += 10;

      warnings.push(
        "⚠️ This link contains encoded characters."
      );

      actions.push(
        "🔎 Be careful if you do not recognize the sender."
      );
    }


    // Unusual port
    if (url.port !== "") {

      riskScore += 15;

      warnings.push(
        "⚠️ This link uses a specific network port."
      );

      actions.push(
        "🔎 Only continue if you recognize and trust the website."
      );
    }


    // Suspicious file
    const suspiciousExtensions = [
      ".exe",
      ".scr",
      ".bat",
      ".cmd",
      ".msi"
    ];

    const lowerPath = url.pathname.toLowerCase();

    const foundExtension = suspiciousExtensions.find(extension =>
      lowerPath.endsWith(extension)
    );

    if (foundExtension) {

      riskScore += 25;

      warnings.push(
        "🚨 This link appears to point to a potentially dangerous file: " +
        foundExtension
      );

      actions.push(
        "🛑 Do not download or run this file unless you completely trust its source."
      );
    }


    // Maximum score
    if (riskScore > 100) {
      riskScore = 100;
    }


    // Result
    let status;
    let color;

    if (riskScore >= 60) {

      status = "🔴 High Risk";
      color = "red";

    } else if (riskScore >= 30) {

      status = "🟠 Be Careful";
      color = "orange";

    } else if (riskScore > 0) {

      status = "🟡 Caution";
      color = "#d6a400";

    } else {

      status = "🟢 No obvious warning signs detected";
      color = "green";
    }


    let report = `
      <h2 style="color:${color};">
        LINKSHIELD SECURITY REPORT
      </h2>

      <h3 style="color:${color};">
        ${status}
      </h3>

      <p>
        <strong>Risk score:</strong> ${riskScore}/100
      </p>
    `;


    if (warnings.length > 0) {

      report += `
        <h3>Why this link was flagged:</h3>

        <p>
          ${warnings.join("<br><br>")}
        </p>

        <h3>What you should do:</h3>

        <p>
          ${actions.join("<br><br>")}
        </p>
      `;

    } else {

      report += `
        <p>
          LinkShield did not find the warning signs it currently checks for.
        </p>

        <p>
          This does not guarantee that the website is safe.
        </p>
      `;
    }


    result.innerHTML = report;


  } catch (error) {

    result.innerHTML = `
      <h2 style="color:red;">
        ❌ Invalid Link
      </h2>

      <p>
        Please enter a valid link, for example:
      </p>

      <strong>https://example.com</strong>
    `;
  }

}

</script>

</body>
</html>
