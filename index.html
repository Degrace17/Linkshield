<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShield</title>

  <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07152f;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #0d2145;
    padding: 32px 22px;
    border-radius: 24px;
    border: 1px solid #24518c;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
    text-align: center;
}

.logo {
    font-size: 64px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px rgba(23, 105, 224, 0.7));
}

h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 1px;
    font-weight: 700;
}

.subtitle {
    color: #9eb6d8;
    margin: 8px 0 28px;
    font-size: 15px;
}

input {
    width: 100%;
    padding: 17px;
    border: 1px solid #31598e;
    border-radius: 14px;
    background: #06162f;
    color: white;
    font-size: 16px;
    outline: none;
}

input::placeholder {
    color: #7188aa;
}

input:focus {
    border-color: #1769e0;
    box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.18);
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 17px;
    border: none;
    border-radius: 14px;
    background: #1769e0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(23, 105, 224, 0.35);
}

button:active {
    transform: scale(0.97);
}

#result {
    margin-top: 22px;
    padding: 16px;
    border-radius: 14px;
    background: #06162f;
    border: 1px solid #24518c;
    color: #dce8f8;
    line-height: 1.6;
    text-align: left;
}
  </style>
</head>

<body>

  <div class="container">

<div class="logo">🛡️</div>

    <h1>LinkShield</h1>

    
<p class="subtitle">Protect yourself from dangerous links.</p>
    <input
      id="linkInput"
      type="text"
      placeholder="Paste a link here..."
    >

    <br>

    <button onclick="checkLink()">Check Link</button>

    
  <div id="result">
  Your security report will appear here.
  </div>
   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LinkShield</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf3ff;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      color: #0b4f9c;
      font-size: 36px;
      margin-bottom: 5px;
    }

    .tagline {
      color: #4f78a8;
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      max-width: 500px;
      padding: 14px;
      border: 2px solid #0b4f9c;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 13px 25px;
      background: #0b4f9c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #083b75;
    }

    #result {
      margin: 25px auto;
      padding: 20px;
      max-width: 600px;
      background: white;
      border-radius: 10px;
      text-align: left;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>🛡️ LinkShield</h1>

  <p class="tagline">
    Check a link before you click.
  </p>

  <input
    type="text"
    id="linkInput"
    placeholder="Paste a link here..."
  >

  <br>

  <button onclick="checkLink()">Check Link</button>

  <div id="result"></div>


<script>

function checkLink() {

  const link = document.getElementById("linkInput").value.trim();
  const result = document.getElementById("result");

  if (link === "") {
    result.innerHTML = "⚠️ Please enter a link first.";
    result.style.color = "orange";
    return;
  }

  try {

    const url = new URL(link);

    let warnings = 0;
    let riskScore = 0;

    let reasons = [];
    let actions = [];


    // 1. HTTPS CHECK
    if (url.protocol !== "https:") {

      warnings++;
      riskScore += 20;

      reasons.push(
        "⚠️ This link does not use HTTPS."
      );

      actions.push(
        "🔐 Avoid entering passwords or sensitive information on this website."
      );
    }


    // 2. IP ADDRESS CHECK
    const hostname = url.hostname;

    const isIPAddress =
      /^(\d{1,3}\.){3}\d{1,3}$/.test(hostname);

    if (isIPAddress) {

      warnings++;
      riskScore += 15;

      reasons.push(
        "⚠️ This link uses an IP address instead of a normal website domain."
      );

      actions.push(
        "🔎 Make sure you know and trust the website before continuing."
      );
    }


    // 3. @ SYMBOL CHECK
    if (link.includes("@")) {

      warnings++;
      riskScore += 20;

      reasons.push(
        "⚠️ This link contains an @ symbol, which can sometimes be used to hide the real destination."
      );

      actions.push(
        "🚨 Do not enter personal or banking information unless you have confirmed the real website."
      );
    }


    // 4. VERY LONG URL CHECK
    if (link.length > 150) {

      warnings++;
      riskScore += 10;

      reasons.push(
        "⚠️ This link is unusually long."
      );

      actions.push(
        "🔎 Be careful with very long links, especially when you do not recognize the sender."
      );
    }


    // 5. SUSPICIOUS WORDS CHECK
    const suspiciousWords = [
      "login",
      "verify",
      "verification",
      "secure",
      "account",
      "password",
      "update",
      "confirm",
      "urgent",
      "unlock",
      "signin",
      "bank",
      "wallet",
      "payment"
    ];

    const lowerLink = link.toLowerCase();

    const foundWords = suspiciousWords.filter(word =>
      lowerLink.includes(word)
    );

    if (foundWords.length > 0) {

      warnings++;
      riskScore += 15;

      reasons.push(
        "⚠️ This link contains words commonly used in urgent account or login requests: " +
        foundWords.join(", ") +
        "."
      );

      actions.push(
        "🔐 Do not enter your password, PIN, OTP, or banking details unless you are certain the website is genuine."
      );
    }


    // 6. MANY SUBDOMAINS CHECK
    const hostnameParts = url.hostname.split(".");

    if (hostnameParts.length > 4) {

      warnings++;
      riskScore += 10;

      reasons.push(
        "⚠️ This link contains many subdomains, which can sometimes be used to make a website address look confusing."
      );

      actions.push(
        "🔎 Carefully check the main domain name before continuing."
      );
    }


    // 7. LOOK-ALIKE DOMAIN CHECK
    const lookAlikePatterns = [
      "paypa1",
      "paypai",
      "facebo0k",
      "faceb00k",
      "g00gle",
      "go0gle",
      "micros0ft",
      "app1e",
      "amaz0n"
    ];

    const foundLookAlikes = lookAlikePatterns.filter(word =>
      hostname.toLowerCase().includes(word)
    );

    if (foundLookAlikes.length > 0) {

      warnings++;
      riskScore += 25;

      reasons.push(
        "🚨 This domain appears to contain characters that imitate a familiar website name."
      );

      actions.push(
        "🛑 Do not enter passwords, payment information, OTPs, or other sensitive information until the domain is verified."
      );
    }


    // 8. ENCODED CHARACTERS CHECK
    if (/%[0-9A-Fa-f]{2}/.test(link)) {

      warnings++;
      riskScore += 10;

      reasons.push(
        "⚠️ This link contains encoded characters that can make the destination harder to read."
      );

      actions.push(
        "🔎 Be extra careful if you do not recognize the sender or website."
      );
    }


    // 9. UNUSUAL PORT CHECK
    const hasUnusualPort = url.port !== "";

    if (hasUnusualPort) {

      warnings++;
      riskScore += 15;

      reasons.push(
        "⚠️ This link uses a specific network port instead of the standard web connection."
      );

      actions.push(
        "🔎 Only continue if you recognize and trust the website."
      );
    }


    // 10. URL SHORTENER CHECK
    const shortenerDomains = [
      "bit.ly",
      "tinyurl.com",
      "t.co",
      "goo.gl",
      "is.gd",
      "ow.ly",
      "buff.ly",
      "cutt.ly"
    ];

    if (shortenerDomains.includes(hostname.toLowerCase())) {

      warnings++;
      riskScore += 15;

      reasons.push(
        "⚠️ This link uses a URL-shortening service, which hides the final destination."
      );

      actions.push(
        "🔎 Avoid opening shortened links from unknown or unexpected sources."
      );
    }


    // 11. SUSPICIOUS DOWNLOAD EXTENSIONS
    const suspiciousExtensions = [
      ".exe",
      ".scr",
      ".bat",
      ".cmd",
      ".msi"
    ];

    const lowerPath = url.pathname.toLowerCase();

    const foundExtension = suspiciousExtensions.find(extension =>
      lowerPath.endsWith(extension)
    );

    if (foundExtension) {

      warnings++;
      riskScore += 25;

      reasons.push(
        "🚨 This link appears to point to a potentially dangerous downloadable file: " +
        foundExtension
      );

      actions.push(
        "🛑 Do not download or run this file unless you completely trust its source."
      );
    }


    // LIMIT SCORE TO 100
    if (riskScore > 100) {
      riskScore = 100;
    }


    // FINAL REPORT
    let status;
    let statusColor;

    if (riskScore >= 60) {

      status = "🔴 High Risk";
      statusColor = "red";

    } else if (riskScore >= 30) {

      status = "🟠 Be Careful";
      statusColor = "orange";

    } else if (riskScore > 0) {

      status = "🟡 Caution";
      statusColor = "#d6a400";

    } else {

      status = "🟢 No obvious warning signs detected";
      statusColor = "green";
    }


    let report = `
      <h2 style="color:${statusColor};">
        LINKSHIELD SECURITY REPORT
      </h2>

      <h3 style="color:${statusColor};">
        ${status}
      </h3>

      <p>
        <strong>Risk score:</strong>
        ${riskScore}/100
      </p>
    `;


    if (warnings > 0) {

      report += `
        <p>
          <strong>Risk indicators detected:</strong>
          ${warnings}
        </p>

        <h3>Why this link was flagged:</h3>

        <p>
          ${reasons.join("<br><br>")}
        </p>

        <h3>What you should do:</h3>

        <p>
          ${actions.join("<br><br>")}
        </p>
      `;

    } else {

      report += `
        <p>
          <strong>What this means:</strong>
        </p>

        <p>
          LinkShield did not find the warning signs it currently checks for.
          This does not guarantee that the website is safe, so always make sure
          you recognize the website before entering sensitive information.
        </p>
      `;
    }


    result.innerHTML = report;
    result.style.color = "#222";

  } catch (error) {

    result.innerHTML = `
      <h2 style="color:red;">
        ❌ Invalid Link
      </h2>

      <p>
        Please enter a valid website link, such as:
      </p>

      <p>
        <strong>https://example.com</strong>
      </p>
    `;

    result.style.color = "#222";
  }
}

</script>
</body>
</html>
