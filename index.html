<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LinkShield</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #061b3a;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    

    .shield {
  width: 70px;
  height: 70px;
  margin: 0 auto 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #123b73;
  border: 1px solid #2b67aa;
  border-radius: 20px;
  font-size: 38px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    h1 {
  margin: 0;
  color: #ffffff;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

h1 span {
  color: #168cff;
}

    .tagline {
      color: #a9c4e8;
      font-size: 19px;
      margin: 0 0 42px;
    }
.container {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  background: #0d2145;
  border: 1px solid #24518c;
  border-radius: 24px;
  padding: 30px 22px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
}
    input {
  width: 100%;
  padding: 16px 18px;
  margin-top: 20px;
  background: #071a36;
  color: #ffffff;
  border: 1px solid #2b67aa;
  border-radius: 14px;
  outline: none;
  font-size: 15px;
  transition: 0.2s ease;
}

input::placeholder {
  color: #7f9abb;
}

input:focus {
  border-color: #168cff;
  box-shadow: 0 0 0 3px rgba(22, 140, 255, 0.12);
}

    .input-box::placeholder {
      color: #aab2c0;
    }

    .input-box:focus {
      border-color: #247cff;
      box-shadow: 0 0 15px rgba(36, 124, 255, 0.25);
    }

    button {
  width: 100%;
  margin-top: 14px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: #168cff;
  color: #ffffff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(22, 140, 255, 0.25);
  transition: 0.2s ease;
}

button:hover {
  background: #0f73d8;
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

    button:hover {
      background: #0f64cf;
      transform: translateY(-1px);
    }

  if (riskScore >= 50) {
  result.innerHTML = `
    <div class="security-report high-risk">
      .report-title {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  font-size: 20px;
  font-weight: bold;
  line-height: 1.25;
  margin-bottom: 20px;
}

.report-shield {
  font-size: 42px;
  flex-shrink: 0;
}

.report-title strong {
  color: #168cff;
}

      <div class="status">🔴 High Risk</div>

      <div class="risk-score">
        Risk score: <strong>${riskScore}/100</strong>
      </div>

      <h3>What this means</h3>
      <p>
        LinkShield detected several warning signs that may indicate
        this link is unsafe or suspicious.
      </p>

      <h3>Why we're concerned</h3>
      <ul>
        ${reasons.map(reason => `<li>${reason}</li>`).join("")}
      </ul>

      <h3>What you should do</h3>
      <ul>
        ${actions.map(action => `<li>${action}</li>`).join("")}
      </ul>
    </div>
  `;

} else if (riskScore >= 10) {
  result.innerHTML = `
    <div class="security-report caution">
      <div class="report-title">🛡️ LINKSHIELD SECURITY REPORT</div>

      <div class="status">🟠 Be Careful</div>

      <div class="risk-score">
        Risk score: <strong>${riskScore}/100</strong>
      </div>

      <h3>What this means</h3>
      <p>
        LinkShield found some unusual warning signs in this link.
      </p>

      <h3>Why we're concerned</h3>
      <ul>
        ${reasons.map(reason => `<li>${reason}</li>`).join("")}
      </ul>

      <h3>What you should do</h3>
      <ul>
        ${actions.map(action => `<li>${action}</li>`).join("")}
      </ul>
    </div>
  `;

} else {
  result.innerHTML = `
    <div class="security-report safe">
      <div class="report-title">🛡️ LINKSHIELD SECURITY REPORT</div>

      <div class="status">🟢 No obvious warning signs detected</div>

      <div class="risk-score">
        Risk score: <strong>0/100</strong>
      </div>

      <h3>What this means</h3>
      <p>
        LinkShield did not find the warning signs it currently checks for.
      </p>

      <p>
        This does not guarantee that the website is safe, so always make
        sure you recognize the website before entering sensitive information.
      </p>
    </div>
  `;
  }
  .security-report {
  margin-top: 20px;
  padding: 20px;
  border-radius: 18px;
  text-align: left;
  border: 1px solid #24518c;
  background: linear-gradient(145deg, #0d2a5a, #081d40);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
}

.report-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.report-shield {
  font-size: 42px;
  flex-shrink: 0;
}

.report-title-text {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.2;
  color: white;
}

.report-title-text span {
  display: block;
  color: #168cff;
  font-size: 15px;
  letter-spacing: 1.5px;
  margin-top: 4px;
}

.status {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 8px;
}

.risk-score {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 14px;
}

.risk-bar {
  width: 100%;
  height: 14px;
  background: #214a7d;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 22px;
}

.risk-fill {
  height: 100%;
  border-radius: 20px;
  transition: width 0.5s ease;
}

.safe-fill {
  background: #22c55e;
}

.caution-fill {
  background: #f59e0b;
}

.high-fill {
  background: #ef4444;
}

.report-card {
  margin-top: 16px;
  padding: 17px;
  border-radius: 15px;
  background: #0a2450;
  border: 1px solid #1765bd;
}

.report-card h3 {
  margin: 0 0 10px;
  color: #168cff;
  font-size: 18px;
}

.report-card p {
  margin: 0;
  line-height: 1.6;
  color: #dcecff;
}

.warning-card {
  border-color: #8a6728;
}

.warning-card h3 {
  color: #ffb13b;
}

.action-card {
  border-color: #1765bd;
}

.action-card h3 {
  color: #168cff;
}

.warning-item {
  padding: 10px 0;
  border-bottom: 1px solid #204574;
  line-height: 1.5;
}

.warning-item:last-child {
  border-bottom: none;
}

.warning-points {
  float: right;
  color: #ffb13b;
  font-weight: bold;
}

.action-item {
  padding: 8px 0;
  line-height: 1.5;
  color: #dcecff;
}

.remember-card {
  border-color: #1765bd;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.remember-icon {
  font-size: 30px;
  flex-shrink: 0;
}

.remember-card p {
  font-size: 14px;
}

.safe {
  border-color: #22c55e;
}

.caution {
  border-color: #f59e0b;
}

.high-risk {
  border-color: #ef4444;
  }
  </style>
</head>

<body>

  <div class="container">

    <div class="shield">🛡️</div>

    <h1>LinkShield</h1>

    <p class="tagline">
      Protect yourself from dangerous links.
    </p>

    <input
      class="input-box"
      type="text"
      id="linkInput"
      placeholder="https://example.com"
    >

    <button onclick="checkLink()">
      Check Link
    </button>

    <div id="result">
      Your security report will appear here.
    </div>

  </div>


  <script>

  function checkLink() {

    let link = document.getElementById("linkInput").value.trim();
const result = document.getElementById("result");

    if (link === "") {
      result.innerHTML = "⚠️ Please enter a link first.";
      result.style.color = "orange";
      return;
    }

    try {

  if (!/^https?:\/\//i.test(link)) {
    link = "https://" + link;
  }

  const url = new URL(link);

      let riskScore = 0;
      let warnings = [];
      let actions = [];


      // HTTPS
      if (url.protocol !== "https:") {

        riskScore += 20;

        warnings.push(
          "⚠️ This link does not use HTTPS."
        );

        actions.push(
          "🔐 Avoid entering sensitive information."
        );
      }


      // IP address
      const isIPAddress =
        /^(\d{1,3}\.){3}\d{1,3}$/.test(url.hostname);

      if (isIPAddress) {

        riskScore += 15;

        warnings.push(
          "⚠️ This link uses an IP address instead of a normal domain."
        );

        actions.push(
          "🔎 Make sure you trust the website."
        );
      }


      // @ symbol
      if (link.includes("@")) {

        riskScore += 20;

        warnings.push(
          "⚠️ This link contains an @ symbol."
        );

        actions.push(
          "🚨 Check the real destination carefully."
        );
      }


      // Long URL
      if (link.length > 150) {

        riskScore += 10;

        warnings.push(
          "⚠️ This link is unusually long."
        );

        actions.push(
          "🔎 Be careful with very long links."
        );
      }


      // Suspicious words
      const suspiciousWords = [
        "login",
        "verify",
        "verification",
        "password",
        "urgent",
        "unlock",
        "signin",
        "bank",
        "payment"
      ];

      const lowerLink = link.toLowerCase();

      const foundWords = suspiciousWords.filter(word =>
        lowerLink.includes(word)
      );

      if (foundWords.length > 0) {

        riskScore += 15;

        warnings.push(
          "⚠️ This link contains suspicious words: " +
          foundWords.join(", ") +
          "."
        );

        actions.push(
          "🔐 Do not enter your password, PIN, OTP, or banking details unless you are certain the website is genuine."
        );
      }


      // Many subdomains
      const hostnameParts = url.hostname.split(".");

      if (hostnameParts.length > 4) {

        riskScore += 10;

        warnings.push(
          "⚠️ This link contains many subdomains."
        );

        actions.push(
          "🔎 Carefully check the main domain name."
        );
      }


      // Encoded characters
      if (/%[0-9A-Fa-f]{2}/.test(link)) {

        riskScore += 10;

        warnings.push(
          "⚠️ This link contains encoded characters."
        );

        actions.push(
          "🔎 Be careful if you do not recognize the sender."
        );
      }


      // Unusual port
      if (url.port !== "") {

        riskScore += 15;

        warnings.push(
          "⚠️ This link uses a specific network port."
        );

        actions.push(
          "🔎 Only continue if you recognize and trust the website."
        );
      }


      // Suspicious file
      const suspiciousExtensions = [
        ".exe",
        ".scr",
        ".bat",
        ".cmd",
        ".msi"
      ];

      const lowerPath = url.pathname.toLowerCase();

      const foundExtension = suspiciousExtensions.find(extension =>
        lowerPath.endsWith(extension)
      );

      if (foundExtension) {

        riskScore += 25;

        warnings.push(
          "🚨 This link appears to point to a potentially dangerous file: " +
          foundExtension
        );

        actions.push(
          "🛑 Do not download or run this file unless you completely trust its source."
        );
      }


      // Maximum score
      if (riskScore > 100) {
        riskScore = 100;
      }


      // Result
      let status;
      let color;

      if (riskScore >= 60) {

        status = "🔴 High Risk";
        color = "red";

      } else if (riskScore >= 30) {

        status = "🟠 Be Careful";
        color = "orange";

      } else if (riskScore > 0) {

        status = "🟡 Caution";
        color = "#d6a400";

      } else {

        status = "🟢 No obvious warning signs detected";
        color = "green";
      }

let report = `
        <div style="
          background:#0d2145;
          border:1px solid #24518c;
          border-radius:16px;
          padding:20px;
          margin-top:20px;
          text-align:left;
          box-shadow:0 8px 20px rgba(0,0,0,0.25);
        ">

          <h2 style="
            color:white;
            text-align:center;
            margin-top:0;
          ">
            🛡️ LINKSHIELD
          </h2>

          <p style="
            text-align:center;
            color:#9fc5f8;
            margin-top:-8px;
          ">
            SECURITY REPORT
          </p>

          <div style="
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:${color};
            margin:20px 0 10px;
          ">
            ${status}
          </div>

          <p style="
            text-align:center;
            color:white;
            font-size:18px;
          ">
            <strong>Risk score:</strong> ${riskScore}/100
          </p>

          <div style="
            width:100%;
            height:12px;
            background:#07152f;
            border-radius:20px;
            overflow:hidden;
            margin:15px 0 25px;
          ">
            <div style="
              width:${riskScore}%;
              height:100%;
              background:${color};
              border-radius:20px;
            "></div>
          </div>
      `;

report += `
  <div class="security-report ${riskClass}" style="
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    text-align:left;
    background:#0b1d3a;
    border:1px solid #24518c;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
  ">

    <h2 style="
      color:white;
      text-align:center;
      margin-top:0;
      margin-bottom:4px;
    ">
      🛡️ LINKSHIELD
    </h2>

    <p style="
      text-align:center;
      color:#9fc5f8;
      margin-top:0;
      margin-bottom:22px;
      font-size:13px;
      letter-spacing:1px;
      font-weight:bold;
    ">
      SECURITY REPORT
    </p>

    <div style="
      background:#07152f;
      border-radius:14px;
      padding:18px;
      text-align:center;
      margin-bottom:20px;
    ">

      <div style="
        font-size:22px;
        font-weight:bold;
        margin-bottom:10px;
      ">
        ${riskTitle}
      </div>

      <div style="
        color:#dbeafe;
        font-size:15px;
        margin-bottom:12px;
      ">
        Risk score: <strong>${riskScore}/100</strong>
      </div>

      <div style="
        width:100%;
        height:10px;
        background:#1e3a5f;
        border-radius:10px;
        overflow:hidden;
      ">
        <div style="
          width:${Math.min(riskScore,100)}%;
          height:100%;
          background:${riskColor};
          border-radius:10px;
        "></div>
      </div>

    </div>

    <h3 style="
      color:#168cff;
      margin-bottom:6px;
    ">
      What this means
    </h3>

    <p style="
      color:#dbeafe;
      line-height:1.6;
      margin-top:0;
    ">
      ${riskExplanation}
    </p>

    ${
      warnings.length > 0
      ? `
        <h3 style="
          color:#168cff;
          margin-bottom:8px;
        ">
          Why we're concerned
        </h3>

        <ul style="
          color:#dbeafe;
          line-height:1.7;
          padding-left:22px;
        ">
          ${warnings.map(warning => `<li>${warning}</li>`).join("")}
        </ul>

        <h3 style="
          color:#168cff;
          margin-bottom:8px;
        ">
          What you should do
        </h3>

        <p style="
          color:#dbeafe;
          line-height:1.6;
        ">
          ${riskAction}
        </p>
      `
      : `
        <div style="
          margin-top:18px;
          padding:14px;
          background:#082b20;
          border:1px solid #22c55e;
          border-radius:12px;
          color:#bbf7d0;
          line-height:1.5;
        ">
          🟢 No obvious warning signs were detected.
        </div>

        <p style="
          color:#9fc5f8;
          line-height:1.6;
          margin-top:16px;
        ">
          This does not guarantee that the website is completely safe.
          LinkShield checks for common warning signs, but some dangerous
          websites may not show obvious indicators.
        </p>
      `
    }

    <div style="
      margin-top:20px;
      padding:14px;
      background:#07152f;
      border-radius:12px;
      border:1px solid #24518c;
      color:#9fc5f8;
      font-size:13px;
      line-height:1.5;
    ">
      🛡️ <strong style="color:white;">LinkShield Safety Reminder</strong><br>
      Never enter passwords, banking details, OTPs, or other sensitive
      information on a website unless you trust and have verified it.
    </div>

  </div>
`;

result.innerHTML = report;
result.style.color = "white";
      

    } catch (error) {

      result.innerHTML = `
        <h2 style="color:red;">
          ❌ Invalid Link
        </h2>

        <p>
          Please enter a valid link, for example:
        </p>

        <strong>https://example.com</strong>
      `;

      result.style.color = "white";
    }

  }

  </script>

</body>
</html>
