<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShield</title>

  <style>
  * {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

.container {
    width: 90%;
    max-width: 420px;
    margin: 40px auto;
    background: white;
    padding: 28px 20px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    text-align: center;
}

.logo {
    font-size: 48px;
    margin-bottom: 5px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.subtitle {
    color: #687386;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d5dce7;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #172033;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

#result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    background: #f4f7fb;
    line-height: 1.6;
}
  </style>
</head>

<body>

  <div class="container">

    <div class="shield">🛡️</div>

    <h1>LinkShield</h1>

    <p>Protect yourself from dangerous links.</p>

    <input
      id="linkInput"
      type="text"
      placeholder="Paste a link here..."
    >

    <br>

    <button onclick="checkLink()">Check Link</button>

    <div id="result"></div>

  </div>
<script>
  function checkLink() {
    const link = document.getElementById("linkInput").value.trim();
    const result = document.getElementById("result");

    if (link === "") {
        result.innerHTML = "⚠️ Please enter a link.";
        return;
    }

    let score = 0;
    let warnings = [];

    if (!link.startsWith("https://")) {
        score += 2;
        warnings.push("The link does not use HTTPS.");
    }

    if (link.includes("@")) {
        score += 3;
        warnings.push("The link contains an @ symbol.");
    }

    if (
        link.includes("bit.ly") ||
        link.includes("tinyurl") ||
        link.includes("t.co")
    ) {
        score += 2;
        warnings.push("This is a shortened link.");
    }

    if (
        link.includes("login") ||
        link.includes("verify") ||
        link.includes("account") ||
        link.includes("password")
    ) {
        score += 2;
        warnings.push("The link contains words commonly used in phishing links.");
    }

    if (score >= 5) {
        result.innerHTML =
            "🚨 <strong>Potentially Suspicious</strong><br><br>" +
            warnings.join("<br>");
    } else if (score >= 2) {
        result.innerHTML =
            "⚠️ <strong>Use Caution</strong><br><br>" +
            warnings.join("<br>");
    } else {
        result.innerHTML =
            "✅ <strong>No obvious warning signs detected.</strong><br><br>" +
            "This does not guarantee that the link is safe.";
    
}
}
  </script>
  

</body>
</html>
