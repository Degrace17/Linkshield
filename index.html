<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShield</title>

  <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07152f;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 90%;
    max-width: 430px;
    background: #0d2145;
    padding: 30px 22px;
    border-radius: 24px;
    border: 1px solid #1d4075;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
    text-align: center;
}

.logo {
    font-size: 64px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px rgba(23, 105, 224, 0.7));
}
h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 1px;
    font-weight: 700;
    text-shadow: 0 0 12px rgba(23, 105, 224, 0.4);
}

.subtitle {
    color: #a9bddb;
    margin: 8px 0 28px;
    font-size: 15px;
}

input {
    width: 100%;
    padding: 16px;
    border: 1px solid #31598e;
    border-radius: 12px;
    background: #071a38;
    color: white;
    font-size: 16px;
    outline: none;
}

input::placeholder {
    color: #7188aa;
}

input:focus {
    border-color: #4d8fe8;
    box-shadow: 0 0 0 3px rgba(77, 143, 232, 0.15);
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #1769e0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

#result {
    margin-top: 22px;
    padding: 16px;
    border-radius: 12px;
    background: #071a38;
    border: 1px solid #1d4075;
    color: #dce8f8;
    line-height: 1.6;
    text-align: left;
}
</style>
</head>

<body>

  <div class="container">

<div class="logo">🛡️</div>

    <h1>LinkShield</h1>

    
<p class="subtitle">Protect yourself from dangerous links.</p>
    <input
      id="linkInput"
      type="text"
      placeholder="Paste a link here..."
    >

    <br>

    <button onclick="checkLink()">Check Link</button>

    <div id="result"></div>

  </div>
<script>
  function checkLink() {
    const link = document.getElementById("linkInput").value.trim();
    const result = document.getElementById("result");

    if (link === "") {
        result.innerHTML = "⚠️ Please enter a link.";
        return;
    }

    let score = 0;
    let warnings = [];

    if (!link.startsWith("https://")) {
        score += 2;
        warnings.push("The link does not use HTTPS.");
    }

    if (link.includes("@")) {
        score += 3;
        warnings.push("The link contains an @ symbol.");
    }

    if (
        link.includes("bit.ly") ||
        link.includes("tinyurl") ||
        link.includes("t.co")
    ) {
        score += 2;
        warnings.push("This is a shortened link.");
    }

    if (
        link.includes("login") ||
        link.includes("verify") ||
        link.includes("account") ||
        link.includes("password")
    ) {
        score += 2;
        warnings.push("The link contains words commonly used in phishing links.");
    }

    if (score >= 5) {
        result.innerHTML =
            "🚨 <strong>Potentially Suspicious</strong><br><br>" +
            warnings.join("<br>");
    } else if (score >= 2) {
        result.innerHTML =
            "⚠️ <strong>Use Caution</strong><br><br>" +
            warnings.join("<br>");
    } else {
        result.innerHTML =
            "✅ <strong>No obvious warning signs detected.</strong><br><br>" +
            "This does not guarantee that the link is safe.";
    
}
}
  </script>
  

</body>
</html>
