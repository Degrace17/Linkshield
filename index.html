<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LinkShield</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #061b3a;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 430px;
      margin: 0 auto;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-top: 25px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #b9d7ff;
      margin-bottom: 30px;
    }

    .card {
      background: #0d2145;
      border: 1px solid #24518c;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #3d6da8;
      background: #07152f;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 12px;
    }

    input::placeholder {
      color: #8da9cc;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #168cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #07152f;
      color: #dbeafe;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      color: #7895bb;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🛡️</div>

    <h1>LinkShield</h1>

    <p class="subtitle">
      Protect yourself from dangerous links.
    </p>

    <div class="card">

      <input
        type="text"
        id="linkInput"
        placeholder="Paste a link here..."
      >

      <button type="button" onclick="checkLink()">
  Check Link
      </button>

      <div id="result">
        Your security report will appear here.
      </div>

    </div>

    <div class="footer">
      LinkShield Security Scanner
    </div>

  </div>


  <script>

    function checkLink() {

      const linkInput = document.getElementById("linkInput");
      const result = document.getElementById("result");

      let link = linkInput.value.trim();

      // Check if empty
      if (link === "") {

        result.innerHTML = `
          <div style="
            color:orange;
            font-weight:bold;
            font-size:18px;
          ">
            ⚠️ Please enter a link first.
          </div>
        `;

        return;
      }


      // Automatically add HTTPS
      if (!/^https?:\/\//i.test(link)) {
        link = "https://" + link;
      }


      let url;

      try {

        url = new URL(link);

      } catch (error) {

        result.innerHTML = `
          <div style="
            color:#ff6b6b;
            font-weight:bold;
            font-size:18px;
          ">
            ❌ Invalid link
          </div>

          <p>
            Please enter a valid website address such as:
            <br><br>
            <strong>example.com</strong>
          </p>
        `;

        return;
      }


      let riskScore = 0;
      let warnings = [];
      let actions = [];


      /*
        1. HTTPS CHECK
      */

      if (url.protocol !== "https:") {

        riskScore += 25;

        warnings.push(
          "This website does not use HTTPS, so your connection may not be securely encrypted."
        );

        actions.push(
          "Avoid entering passwords, card details, or other sensitive information."
        );
      }


      /*
        2. IP ADDRESS CHECK
      */

      function isIpAddress(hostname) {

        const parts = hostname.split(".");

        if (parts.length !== 4) {
          return false;
        }

        return parts.every(part => {

          const number = Number(part);

          return (
            part !== "" &&
            !isNaN(number) &&
            number >= 0 &&
            number <= 255
          );

        });
      }


      if (isIpAddress(url.hostname)) {

        riskScore += 25;

        warnings.push(
          "The link uses a numeric IP address instead of a normal website name."
        );

        actions.push(
          "Be careful before entering personal information."
        );
      }


      /*
        3. @ SYMBOL CHECK
      */

      if (url.href.includes("@")) {

        riskScore += 20;

        warnings.push(
          "The link contains an @ symbol, which can sometimes be used to disguise the real website address."
        );

        actions.push(
          "Check the actual website name carefully before continuing."
        );
      }


      /*
        4. SUSPICIOUS WORDS
      */

      const suspiciousWords = [
        "login",
        "verify",
        "password",
        "account",
        "bank",
        "secure",
        "update",
        "confirm"
      ];

      const lowerUrl = url.href.toLowerCase();

      const foundWords = suspiciousWords.filter(word =>
        lowerUrl.includes(word)
      );


      if (foundWords.length > 0) {

        riskScore += 15;

        warnings.push(
          "The link contains words commonly used in urgent account or login requests."
        );

        actions.push(
          "Do not enter your password or financial information unless you trust the website."
        );
      }


      /*
        5. VERY LONG URL
      */

      if (url.href.length > 150) {

        riskScore += 10;

        warnings.push(
          "This URL is unusually long and contains a lot of information."
        );

        actions.push(
          "Be cautious and verify the destination before opening it."
        );
      }


      /*
        6. MANY SUBDOMAINS
      */

      const hostnameParts = url.hostname.split(".");

      if (
        hostnameParts.length > 4 &&
        !isIpAddress(url.hostname)
      ) {

        riskScore += 15;

        warnings.push(
          "The website uses many subdomains, which can sometimes be used to disguise a suspicious website."
        );

        actions.push(
          "Look carefully at the main domain name before trusting the link."
        );
      }


      /*
        7. LOOK-ALIKE WEBSITE NAMES
      */

      const lookAlikeNames = [
        "paypa1",
        "micros0ft",
        "faceb00k",
        "g00gle",
        "amaz0n"
      ];
/*
  SUSPICIOUS DOMAIN PATTERN
*/

const suspiciousDomainPatterns = [
  "-secure-",
  "-official-",
  "-verification-",
  "-support-",
  "-account-"
];

const hasSuspiciousDomainPattern = suspiciousDomainPatterns.some(pattern =>
  url.hostname.toLowerCase().includes(pattern)
);

if (hasSuspiciousDomainPattern) {
  riskScore += 10;

  warnings.push(
    "The website domain uses a pattern that can sometimes be used to make a site appear more official or trustworthy."
  );

  actions.push(
    "Check the domain carefully and make sure it is the official website before entering sensitive information."
  );
}
      const foundLookAlike = lookAlikeNames.some(name =>
        url.hostname.toLowerCase().includes(name)
      );


      if (foundLookAlike) {

        riskScore += 20;

        warnings.push(
          "The website name contains characters that resemble a well-known brand."
        );

        actions.push(
          "Verify the website address carefully before entering any information."
        );
      }


      /*
        8. ENCODED CHARACTERS
      */
/*
  PUNYCODE / ENCODED DOMAIN
*/

if (url.hostname.toLowerCase().includes("xn--")) {

  riskScore += 10;

  warnings.push(
    "The website domain uses an encoded internationalized domain name that may be harder to recognize."
  );

  actions.push(
    "Check the domain carefully and make sure it belongs to the website you intended to visit."
  );
}
      if (/%[0-9A-Fa-f]{2}/.test(url.href)) {

        riskScore += 10;

        warnings.push(
          "The URL contains encoded characters that make part of the address harder to read."
        );

        actions.push(
          "Be cautious and verify the destination before continuing."
        );
      }


      /*
        9. UNUSUAL PORT
      */

      if (
        url.port !== "" &&
        !["80", "443"].includes(url.port)
      ) {

        riskScore += 15;

        warnings.push(
          "This website uses a non-standard network port."
        );

        actions.push(
          "Avoid entering sensitive information unless you know why this port is being used."
        );
      }


      /*
        10. URL SHORTENER
      */

      const shortenerDomains = [
        "bit.ly",
        "tinyurl.com",
        "t.co",
        "goo.gl",
        "is.gd",
        "cutt.ly",
        "shorturl.at"
      ];

      if (
        shortenerDomains.some(domain =>
          url.hostname.toLowerCase() === domain ||
          url.hostname.toLowerCase().endsWith("." + domain)
        )
      ) {

        riskScore += 10;

        warnings.push(
          "This link uses a URL-shortening service, which hides the final destination."
        );

        actions.push(
          "Be careful and verify where the shortened link leads before opening it."
        );
      }


      /*
        11. SUSPICIOUS DOWNLOADABLE FILES
      */

      const suspiciousExtensions = [
        ".exe",
        ".scr",
        ".bat",
        ".cmd",
        ".msi"
      ];

      const lowerPath = url.pathname.toLowerCase();

      const hasSuspiciousFile = suspiciousExtensions.some(extension =>
        lowerPath.endsWith(extension)
      );


      if (hasSuspiciousFile) {

        riskScore += 20;

        warnings.push(
          "The link appears to point to a potentially risky downloadable file."
        );

        actions.push(
          "Do not download or open the file unless you are completely sure it is safe."
        );
      }


      /*
        LIMIT SCORE TO 100
      */

      if (riskScore > 100) {
        riskScore = 100;
      }


      /*
        DETERMINE SECURITY STATUS
      */

      let status;
      let color;
      let explanation;


      if (riskScore >= 50) {

        status = "🔴 High Risk";
        color = "#ff4d4d";

        explanation =
          "This link contains multiple warning signs. We recommend avoiding it until you can verify that the website is legitimate.";

      } else if (riskScore >= 10) {

        status = "🟠 Be Careful";
        color = "#ffae42";

        explanation =
          "This link contains some warning signs. It may not necessarily be dangerous, but you should verify it before continuing.";

      } else {

        status = "🟢 No obvious warning signs detected";
        color = "#32d583";

        explanation =
          "LinkShield did not detect obvious warning signs in this link.";

      }


      /*
        GREEN RESULT
      */

      if (riskScore < 10) {

        result.innerHTML = `

          <div style="
            text-align:center;
          ">

            <div style="
              font-size:22px;
              font-weight:bold;
              color:${color};
              margin:10px 0;
            ">
              ${status}
            </div>

            <p style="
              color:white;
              font-size:18px;
            ">
              <strong>Risk score:</strong> ${riskScore}/100
            </p>

            <div style="
              width:100%;
              height:12px;
              background:#07152f;
              border-radius:20px;
              overflow:hidden;
              margin:15px 0 25px;
            ">

              <div style="
                width:${riskScore}%;
                height:100%;
                background:${color};
                border-radius:20px;
              ">
              </div>

            </div>

            <p style="
              color:#dbeafe;
              line-height:1.7;
            ">
              ${explanation}
            </p>

            <p style="
              color:#9bb8dd;
              font-size:14px;
              line-height:1.6;
            ">
              This does not guarantee that the website is safe.
              LinkShield checks for common warning signs, but no automated
              scanner can detect every threat.
            </p>

          </div>
        `;

        return;
      }


      /*
        WARNING RESULT
      */

      result.innerHTML = `

        <div>

          <div style="
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:${color};
            margin:20px 0 10px;
          ">
            ${status}
          </div>


          <p style="
            text-align:center;
            color:white;
            font-size:18px;
          ">
            <strong>Risk score:</strong> ${riskScore}/100
          </p>


          <div style="
            width:100%;
            height:12px;
            background:#07152f;
            border-radius:20px;
            overflow:hidden;
            margin:15px 0 25px;
          ">

            <div style="
              width:${riskScore}%;
              height:100%;
              background:${color};
              border-radius:20px;
            ">
            </div>

          </div>


          <p style="
            color:#dbeafe;
            line-height:1.7;
          ">
            ${explanation}
          </p>


          <h3 style="
            color:#168cff;
            margin-bottom:8px;
          ">
            Why we're concerned
          </h3>


          <ul style="
            color:#dbeafe;
            line-height:1.7;
            padding-left:22px;
          ">

            ${warnings.map(warning =>
              `<li>${warning}</li>`
            ).join("")}

          </ul>


          <h3 style="
            color:#168cff;
            margin-bottom:8px;
          ">
            What you should do
          </h3>


          <ul style="
            color:#dbeafe;
            line-height:1.7;
            padding-left:22px;
          ">

            ${actions.map(action =>
              `<li>${action}</li>`
            ).join("")}

          </ul>


          <p style="
            color:#9bb8dd;
            font-size:14px;
            line-height:1.6;
            margin-top:20px;
          ">
            LinkShield provides an automated warning based on common
            suspicious-link patterns. It cannot guarantee that a website
            is safe or dangerous.
          </p>

        </div>

      `;

    }

  </script>

</body>
</html>
