<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShield</title>

  <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07152f;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #0d2145;
    padding: 32px 22px;
    border-radius: 24px;
    border: 1px solid #24518c;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
    text-align: center;
}

.logo {
    font-size: 64px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px rgba(23, 105, 224, 0.7));
}

h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 1px;
    font-weight: 700;
}

.subtitle {
    color: #9eb6d8;
    margin: 8px 0 28px;
    font-size: 15px;
}

input {
    width: 100%;
    padding: 17px;
    border: 1px solid #31598e;
    border-radius: 14px;
    background: #06162f;
    color: white;
    font-size: 16px;
    outline: none;
}

input::placeholder {
    color: #7188aa;
}

input:focus {
    border-color: #1769e0;
    box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.18);
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 17px;
    border: none;
    border-radius: 14px;
    background: #1769e0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(23, 105, 224, 0.35);
}

button:active {
    transform: scale(0.97);
}

#result {
    margin-top: 22px;
    padding: 16px;
    border-radius: 14px;
    background: #06162f;
    border: 1px solid #24518c;
    color: #dce8f8;
    line-height: 1.6;
    text-align: left;
}
  </style>
</head>

<body>

  <div class="container">

<div class="logo">🛡️</div>

    <h1>LinkShield</h1>

    
<p class="subtitle">Protect yourself from dangerous links.</p>
    <input
      id="linkInput"
      type="text"
      placeholder="Paste a link here..."
    >

    <br>

    <button onclick="checkLink()">Check Link</button>

    <div id="result"></div>

  <script>
function checkLink() {
  const link = document.getElementById("linkInput").value.trim();
  const result = document.getElementById("result");

  if (link === "") {
    result.innerHTML = "⚠️ Please enter a link first.";
    result.style.color = "orange";
    return;
  }

  try {
    const url = new URL(link);

    const suspiciousWords = [
      "login",
      "verify",
      "password",
      "account",
      "bank",
      "secure",
      "update",
      "confirm"
    ];

    const foundWords = suspiciousWords.filter(word =>
      url.href.toLowerCase().includes(word)
    );

    if (url.protocol !== "https:") {
      result.innerHTML =
        "🚨 Warning: This link does not use HTTPS.";
      result.style.color = "red";
    } else if (foundWords.length > 0) {
      result.innerHTML =
        "⚠️ Warning: This link contains suspicious words: " +
        foundWords.join(", ");
      result.style.color = "orange";
    } else {
      result.innerHTML =
        "🛡️ No obvious warning signs detected.<br>" +
        "This does not guarantee that the link is safe.";
      result.style.color = "green";
    }

  } catch (error) {
    result.innerHTML = "❌ This does not appear to be a valid link.";
    result.style.color = "red";
  }
}

  
  </script>
  

</body>
</html>
