<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShield</title>

  <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07152f;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #0d2145;
    padding: 32px 22px;
    border-radius: 24px;
    border: 1px solid #24518c;
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
    text-align: center;
}

.logo {
    font-size: 64px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px rgba(23, 105, 224, 0.7));
}

h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 1px;
    font-weight: 700;
}

.subtitle {
    color: #9eb6d8;
    margin: 8px 0 28px;
    font-size: 15px;
}

input {
    width: 100%;
    padding: 17px;
    border: 1px solid #31598e;
    border-radius: 14px;
    background: #06162f;
    color: white;
    font-size: 16px;
    outline: none;
}

input::placeholder {
    color: #7188aa;
}

input:focus {
    border-color: #1769e0;
    box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.18);
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 17px;
    border: none;
    border-radius: 14px;
    background: #1769e0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(23, 105, 224, 0.35);
}

button:active {
    transform: scale(0.97);
}

#result {
    margin-top: 22px;
    padding: 16px;
    border-radius: 14px;
    background: #06162f;
    border: 1px solid #24518c;
    color: #dce8f8;
    line-height: 1.6;
    text-align: left;
}
  </style>
</head>

<body>

  <div class="container">

<div class="logo">🛡️</div>

    <h1>LinkShield</h1>

    
<p class="subtitle">Protect yourself from dangerous links.</p>
    <input
      id="linkInput"
      type="text"
      placeholder="Paste a link here..."
    >

    <br>

    <button onclick="checkLink()">Check Link</button>

    
  <div id="result">
  Your security report will appear here.
  </div>
    </div>
<script>
function checkLink() {
  const link = document.getElementById("linkInput").value.trim();
  const result = document.getElementById("result");

  if (link === "") {
    result.innerHTML = "⚠️ Please enter a link first.";
    result.style.color = "orange";
    return;
  }

  try {
    const url = new URL(link);

    const suspiciousWords = [
      "login",
      "verify",
      "password",
      "account",
      "bank",
      "secure",
      "update",
      "confirm"
    ];

    const foundWords = suspiciousWords.filter(word =>
      url.href.toLowerCase().includes(word)
    );

    const ipAddressPattern =
      /^https?:\/\/(\d{1,3}\.){3}\d{1,3}/;

    const isIpAddress = ipAddressPattern.test(url.href);
    const hasAtSymbol = url.href.includes("@");
    const hasEncodedCharacters = /%[0-9A-Fa-f]{2}/.test(url.href);
    const isVeryLong = url.href.length > 150;
const hasUnusualPort =
  url.port !== "" &&
  !["80", "443"].includes(url.port);
    let warnings = 0;
    let riskScore = 0;
    let reasons = [];
    let actions = [];
const hostnameParts = url.hostname.split(".");
    const shortenerDomains = [
  "bit.ly",
  "tinyurl.com",
  "t.co",
  "goo.gl",
  "ow.ly",
  "is.gd",
  "buff.ly",
  "cutt.ly"
];

const isShortenedLink = shortenerDomains.includes(
  url.hostname.toLowerCase()
);
    const suspiciousFileExtensions = [
  ".exe",
  ".scr",
  ".bat",
  ".cmd",
  ".msi"
];

const hasSuspiciousFileExtension =
  suspiciousFileExtensions.some(extension =>
    url.pathname.toLowerCase().endsWith(extension)
  );
if (hostnameParts.length > 4 && !isIpAddress) {
  warnings++;
  riskScore += 15;

  reasons.push(
    "⚠️ This link uses many subdomains, which can sometimes be used to disguise a suspicious website."
  );

  actions.push(
    "🔎 Check the main website name carefully before continuing."
  );
}
  const lookAlikeWords = [
  "paypa1",
  "micros0ft",
  "faceb00k",
  "g00gle",
  "amaz0n"
];

const hasLookAlike = lookAlikeWords.some(word =>
  url.hostname.toLowerCase().includes(word)
);

if (hasLookAlike) {
  
  warnings++;
  riskScore += 20;

  reasons.push(
    "⚠️ This domain may be using characters that imitate a familiar website name."
  );

  actions.push(
    "🔎 Check the spelling of the website carefully before entering any personal information."
  );
}  
    if (isShortenedLink) {
  warnings++;
  riskScore += 10;

  reasons.push(
    "⚠️ This link uses a URL-shortening service, which hides the final destination."
  );

  actions.push(
    "🔎 Check the final destination carefully before continuing."
  );
    }
    if (hasSuspiciousFileExtension) {
  warnings++;
  riskScore += 20;

  reasons.push(
    "⚠️ This link points to a potentially risky downloadable file."
  );

  actions.push(
    "🛑 Do not download or open the file unless you completely trust the source."
  );
    }
    if (url.protocol !== "https:") {
      warnings++;
      riskScore += 25;

      reasons.push(
        "⚠️ This link does not use HTTPS. Your connection may not be securely encrypted."
      );

      actions.push(
        "🔐 Avoid entering passwords or payment information."
      );
    }

    if (isIpAddress) {
      warnings++;
      riskScore += 25;

      reasons.push(
        "⚠️ This link uses a numeric IP address instead of a normal website name."
      );

      actions.push(
        "🌐 Make sure you recognize the website before opening or entering personal information."
      );
    }
if (hasUnusualPort) {
  warnings++;
  riskScore += 15;

  reasons.push(
    "⚠️ This link uses a non-standard port."
  );

  actions.push(
    "🔎 Be careful when visiting links that use unusual ports."
  );
}
    if (hasAtSymbol) {
      warnings++;
      riskScore += 20;

      reasons.push(
        "⚠️ This link contains an @ symbol, which can sometimes be used to disguise the real website address."
      );

      actions.push(
        "🔎 Check the website name carefully before continuing."
      );
    }
    
    if (isVeryLong) {
      warnings++;
      riskScore += 10;

      reasons.push(
        "⚠️ This link is unusually long and may contain extra information that makes it harder to understand where the link leads."
      );

      actions.push(
        "🔎 Avoid clicking if you were not expecting this link."
      );
    }

    if (foundWords.length > 0) {
      warnings++;
      riskScore += 15;

      reasons.push(
        "⚠️ This link contains words commonly used in urgent account or login requests: " +
        foundWords.join(", ") +
        "."
      );

      actions.push(
        "🔐 Do not enter your password, PIN, OTP, or banking details unless you are certain the website is genuine."
      );
    }
actions.push(
        "🔐 Do not enter your password, PIN, OTP, or banking details unless you are certain the website is genuine."
      );
    }

    if (isShortenedLink) {
      warnings++;
      riskScore += 15;

      reasons.push(
        "⚠️ This link uses a URL-shortening service, which can hide the website it eventually leads to."
      );

      actions.push(
        "🔎 Check the final destination carefully before entering passwords, payment details, or other sensitive information."
      );
    }

    if (riskScore >= 50) {
    if (riskScore >= 50) {
      result.innerHTML =
        "<strong>🛡️ LINKSHIELD SECURITY REPORT</strong><br><br>" +
        "🔴 <strong>High Risk</strong><br>" +
        "Risk score: " + riskScore + "/100<br><br>" +
        "<strong>What this means:</strong><br>" +
        "This link has several warning signs that deserve your attention. " +
        "LinkShield recommends avoiding sensitive information on this website until you can verify that it is genuine." +
        "<br><br>" +
        "<strong>Why we're concerned:</strong><br>" +
        reasons.join("<br>") +
        "<br><br>" +
        "<strong>What you should do:</strong><br>" +
        actions.join("<br>");

      result.style.color = "red";

    } else if (riskScore >= 10 ) {
      result.innerHTML =
        "<strong>🛡️ LINKSHIELD SECURITY REPORT</strong><br><br>" +
        "🟠 <strong>Be Careful</strong><br>" +
        "Risk score: " + riskScore + "/100<br><br>" +
        "<strong>What this means:</strong><br>" +
        "LinkShield found something unusual about this link. " +
        "This does not automatically mean the website is dangerous, but you should check it carefully before sharing sensitive information." +
        "<br><br>" +
        "<strong>Why we're concerned:</strong><br>" +
        reasons.join("<br>") +
        "<br><br>" +
        "<strong>What you should do:</strong><br>" +
        actions.join("<br>");

      result.style.color = "orange";

    } else {
      result.innerHTML =
        "<strong>🛡️ LINKSHIELD SECURITY REPORT</strong><br><br>" +
        "🟢 <strong>No obvious warning signs detected</strong><br>" +
        "Risk score: " + riskScore + "/100<br><br>" +
        "<strong>What this means:</strong><br>" +
        "LinkShield did not find the warning signs it currently checks for. " +
        "This does not guarantee that the website is safe, so always make sure you recognize the website before entering sensitive information.";

      result.style.color = "green";
    }

  } catch (error) {
    result.innerHTML =
      "❌ This does not appear to be a valid link.";
    result.style.color = "red";
  }
}
        </script>
</body>
</html>
