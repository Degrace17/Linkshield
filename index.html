<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShield</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #aab4c3;
      font-size: 18px;
    }

    .shield {
      font-size: 80px;
      margin: 30px 0;
    }

    input {
      width: 90%;
      max-width: 500px;
      padding: 16px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      margin-top: 20px;
    }

    button {
      margin-top: 15px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="shield">🛡️</div>

    <h1>LinkShield</h1>

    <p>Protect yourself from dangerous links.</p>

    <input
      id="linkInput"
      type="text"
      placeholder="Paste a link here..."
    >

    <br>

    <button onclick="checkLink()">Check Link</button>

    <div id="result"></div>

  </div>
<script>
  function checkLink() {
    const link = document.getElementById("linkInput").value.trim();
    const result = document.getElementById("result");

    if (link === "") {
        result.innerHTML = "⚠️ Please enter a link.";
        return;
    }

    let score = 0;
    let warnings = [];

    if (!link.startsWith("https://")) {
        score += 2;
        warnings.push("The link does not use HTTPS.");
    }

    if (link.includes("@")) {
        score += 3;
        warnings.push("The link contains an @ symbol.");
    }

    if (
        link.includes("bit.ly") ||
        link.includes("tinyurl") ||
        link.includes("t.co")
    ) {
        score += 2;
        warnings.push("This is a shortened link.");
    }

    if (
        link.includes("login") ||
        link.includes("verify") ||
        link.includes("account") ||
        link.includes("password")
    ) {
        score += 2;
        warnings.push("The link contains words commonly used in phishing links.");
    }

    if (score >= 5) {
        result.innerHTML =
            "🚨 <strong>Potentially Suspicious</strong><br><br>" +
            warnings.join("<br>");
    } else if (score >= 2) {
        result.innerHTML =
            "⚠️ <strong>Use Caution</strong><br><br>" +
            warnings.join("<br>");
    } else {
        result.innerHTML =
            "✅ <strong>No obvious warning signs detected.</strong><br><br>" +
            "This does not guarantee that the link is safe.";
    
}
}
  </script>
  

</body>
</html>
